             ═════════════════════════════════════════════════════════════ -->

              "legalName": "ПМ АВТО ГРУП ЕООД",

                "width": 512,
                "height": 512
              },
              "image": "https://bibicars.bg/og-image.png",
              "description": "Auction-to-keys vehicle import platform — pre-owned cars from US and South Korea delivered to Bulgaria.",
              "address": {
                "@type": "PostalAddress",
                "streetAddress": "бул. Черни връх 230",
                "addressLocality": "София",
                "addressCountry": "BG"
              },
              "vatID": "BG206637283",
              "taxID": "206637283",
              "founder": {
                "@type": "Person",
                "name": "Павло Маслов"
              },

                { "@type": "Country", "name": "Romania" },

              ],
              "sameAs": []
            },

              "@id": "https://bibicars.bg/#autodealer",
              "name": "ECO.NOVA",
              "url": "https://bibicars.bg/",
              "image": "https://bibicars.bg/og-image.png",
              "priceRange": "€€",
              "currenciesAccepted": "EUR, BGN, USD",
              "paymentAccepted": "Wire transfer, Stripe, Cash",
              "address": {
                "@type": "PostalAddress",
                "streetAddress": "бул. Черни връх 230",
                "addressLocality": "София",
                "postalCode": "1407",
                "addressCountry": "BG"
              },
              "geo": {
                "@type": "GeoCoordinates",
                "latitude": 42.6630,
                "longitude": 23.3170
              },
              "openingHoursSpecification": [
                {
                  "@type": "OpeningHoursSpecification",
                  "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
                  "opens": "09:00",
                  "closes": "18:00"
                },
                {
                  "@type": "OpeningHoursSpecification",

                {"@type":"Offer","itemOffered":{"@type":"Car","name":"South Korea auction vehicles (ENCAR)"}}
              ]

            {

              "@id": "https://bibicars.bg/#website",
              "url": "https://bibicars.bg/",
              "name": "ECO.NOVA",
              "description": "Pre-owned car import platform",
              "publisher": { "@id": "https://bibicars.bg/#organization" },
              "inLanguage": ["en", "bg"],
              "potentialAction": {

                  "@type": "EntryPoint",
                  "urlTemplate": "https://bibicars.bg/search/{search_term_string}"
                },
                "query-input": "required name=search_term_string"
              }
            }
          ]
